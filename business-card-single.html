<!DOCTYPE html>
<html lang="ky">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SAMARA — санариптик визитка</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,700;1,500&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<script>document.documentElement.classList.add("js")</script>
<style>
/* ТҮСТӨР */
:root{--bk:#080808;--g1:#111;--iv:#f4efe8;--ch:#d8c7a3;--gd:#b9975b;--mu:#9a958c}
*{box-sizing:border-box;margin:0}
html{scroll-behavior:smooth}
body{font-family:Inter,system-ui,sans-serif;background:radial-gradient(circle at 15% 10%,rgba(185,151,91,.22),transparent 45%),radial-gradient(circle at 90% 85%,rgba(90,76,200,.2),transparent 45%),var(--bk);background-attachment:fixed;color:var(--iv);line-height:1.6;overflow-x:hidden}
h1,h2,h3,.logo,.lead{font-family:'Cormorant Garamond',Georgia,serif}
a{color:inherit;text-decoration:none}
:focus-visible{outline:2px solid var(--gd);outline-offset:3px}
.muted{color:var(--mu)}.center{text-align:center}

/* ФОН */
.bg{position:fixed;inset:0;z-index:-1;overflow:hidden;background:linear-gradient(135deg,#080808,#14120e,#080808)}
.bg i{position:absolute;border-radius:50%;filter:blur(90px);opacity:.28;animation:drift 18s ease-in-out infinite}
.bg i:nth-child(1){width:420px;height:420px;background:var(--gd);top:-8%;left:-6%}
.bg i:nth-child(2){width:360px;height:360px;background:#5a4cc8;bottom:-8%;right:-4%;animation-delay:-6s}
.bg i:nth-child(3){width:260px;height:260px;background:var(--ch);top:45%;left:55%;animation-delay:-11s;opacity:.15}
@keyframes drift{50%{transform:translate(40px,-30px) scale(1.1)}}

/* НАВИГАЦИЯ */
.nav{position:fixed;top:0;left:0;right:0;z-index:50;display:flex;justify-content:space-between;align-items:center;padding:16px 5vw;background:rgba(10,10,10,.55);backdrop-filter:blur(14px);border-bottom:1px solid rgba(216,199,163,.15)}
.logo{font-size:1.5rem;letter-spacing:.25em;color:var(--ch)}
nav{display:flex;gap:22px;align-items:center;font-size:.85rem;color:var(--mu)}
nav a:hover{color:var(--ch)}
.pill{border:1px solid var(--gd);padding:6px 14px;border-radius:30px;color:var(--ch)}

/* БАШКЫ БЕТ */
.hero{min-height:100vh;display:grid;grid-template-columns:1.2fr 1fr;gap:40px;align-items:center;padding:120px 6vw 60px;max-width:1200px;margin:auto}
h1{font-size:clamp(2.8rem,8vw,6rem);line-height:1.02}
h1 em{color:var(--ch);font-style:italic}
.lead{font-size:clamp(1.5rem,3vw,2.2rem);color:var(--ch);margin-top:14px}
.tech{letter-spacing:.2em;font-size:.85rem;color:var(--gd);margin:6px 0 16px}
.sub{max-width:480px;color:#cfc9bf;margin-bottom:28px}
.cta{display:flex;gap:12px;flex-wrap:wrap}
.btn{display:inline-block;padding:13px 26px;border-radius:40px;border:1px solid var(--gd);color:var(--ch);font:600 .78rem Inter;letter-spacing:.12em;background:transparent;cursor:pointer;transition:.3s}
.btn:hover{box-shadow:0 0 28px rgba(185,151,91,.4);transform:translateY(-2px)}
.btn.gold{background:linear-gradient(110deg,var(--gd),var(--ch));color:#111;border:0}
.btn.big{padding:18px 40px;font-size:.95rem}
.photo,.avatar{position:relative;margin:auto;aspect-ratio:3/4;width:min(380px,80%);border-radius:200px 200px 28px 28px;overflow:hidden;border:1px solid var(--gd);box-shadow:0 0 60px rgba(185,151,91,.25),0 30px 60px rgba(0,0,0,.5)}
.photo img,.avatar img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:center 20%}
.ph{position:absolute;inset:0;display:grid;place-items:center;font:700 6rem 'Cormorant Garamond';color:var(--gd);background:linear-gradient(160deg,#1c1913,#0c0b09)}

/* БӨЛҮМДӨР */
.sec{max-width:1000px;margin:auto;padding:90px 6vw}
.sec h2{font-size:clamp(2rem,5vw,3.2rem);margin-bottom:34px;color:var(--ch)}
.acc{display:grid;gap:14px}
.item{border:1px solid rgba(216,199,163,.2);border-radius:20px;background:linear-gradient(145deg,rgba(255,255,255,.07),rgba(255,255,255,.015));backdrop-filter:blur(8px);transition:.3s}
.item:hover,.item.open{border-color:var(--gd);box-shadow:0 0 30px rgba(185,151,91,.18)}
.item button{width:100%;display:flex;justify-content:space-between;align-items:center;background:none;border:0;color:var(--iv);padding:22px 26px;font:600 1.15rem 'Cormorant Garamond';cursor:pointer;text-align:left}
.item button span{color:var(--gd);transition:.3s}.item.open button span{transform:rotate(45deg)}
.body{max-height:0;overflow:hidden;transition:max-height .6s cubic-bezier(.2,.7,.2,1)}
.inner{padding:0 26px 24px}
.inner h4{color:var(--ch);font-weight:600;margin-top:12px}
.inner p{color:#cfc9bf}.inner .now{color:#7ee0a0;font-size:.8rem}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:22px}
.proj{padding:28px;border-radius:24px;border:1px solid rgba(216,199,163,.2);background:linear-gradient(145deg,rgba(255,255,255,.07),rgba(255,255,255,.015));display:flex;flex-direction:column;justify-content:space-between;gap:20px;transition:.3s}
.proj:hover{transform:translateY(-6px);border-color:var(--gd);box-shadow:0 0 40px rgba(185,151,91,.2)}
.proj b{font:700 2.4rem 'Cormorant Garamond';color:rgba(216,199,163,.3)}
.proj h3{font-size:1.5rem;color:var(--ch)}
.proj .row{display:flex;gap:10px;flex-wrap:wrap}.proj .btn{padding:9px 18px;font-size:.72rem}
.timeline{list-style:none;position:relative;padding-left:30px;border-left:1px solid rgba(216,199,163,.35)}
.timeline li{position:relative;padding:0 0 28px;font-size:1.05rem}
.timeline li::before{content:"";position:absolute;left:-37px;top:7px;width:13px;height:13px;border-radius:50%;background:var(--gd);box-shadow:0 0 14px var(--gd)}
.timeline b{color:var(--ch)}
.foot{text-align:center;padding:50px 6vw;border-top:1px solid rgba(216,199,163,.15)}
.js .reveal{opacity:0;transform:translateY(30px);transition:1s cubic-bezier(.2,.7,.2,1)}.js .reveal.in{opacity:1;transform:none}

/* ВИЗИТКА */
.cardwrap{min-height:100vh;display:grid;place-content:center;justify-items:center;gap:26px;padding:30px 5vw}
.scene{perspective:1200px;width:min(380px,92vw);height:620px;cursor:pointer}
.flip{position:relative;width:100%;height:100%;transition:transform .9s cubic-bezier(.2,.7,.2,1);transform-style:preserve-3d}
.flip.turned{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:30px;border:1px solid var(--gd);background:linear-gradient(160deg,rgba(255,255,255,.1),rgba(255,255,255,.02)),#0d0c0a;backdrop-filter:blur(14px);box-shadow:0 30px 70px rgba(0,0,0,.6),0 0 50px rgba(185,151,91,.18);display:flex;flex-direction:column;align-items:center;padding:28px 24px;text-align:center}
.back{transform:rotateY(180deg);justify-content:center;gap:18px}
.avatar{width:150px;border-radius:80px 80px 18px 18px;margin:0 0 14px}.avatar .ph{font-size:3rem}
.face h1{font-size:2.6rem;letter-spacing:.2em}
.contacts{display:grid;grid-template-columns:1fr 1fr;gap:10px;width:100%;margin-top:18px}
.contacts a{border:1px solid rgba(216,199,163,.35);border-radius:14px;padding:12px 6px;font-size:.8rem;color:var(--ch);transition:.3s}
.contacts a:hover{background:var(--gd);color:#111}
.contacts a:first-child{grid-column:1/-1;background:linear-gradient(110deg,var(--gd),var(--ch));color:#111;font-weight:600}
.qr{width:220px;height:220px;background:#fff;border-radius:18px;display:grid;place-items:center;padding:12px;color:#333;font-size:.85rem}
.qr img{width:100%;height:100%;object-fit:contain}
.actions{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;max-width:620px}
.toast{min-height:1.4em;color:var(--ch);font-size:.9rem}

@media(max-width:860px){
.hero{grid-template-columns:1fr;text-align:center;padding-top:110px}.sub{margin-inline:auto}.cta{justify-content:center}
nav a:not(.pill){display:none}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition-duration:.01s!important}.reveal{opacity:1;transform:none}}

</style>
</head>
<body class="cardpage">
<div class="bg" aria-hidden="true"><i></i><i></i><i></i></div>

<main class="cardwrap">
  <!-- 3D FLIP ВИЗИТКА -->
  <div class="scene" id="scene" tabindex="0" role="button" aria-label="Визитканы буруу">
    <div class="flip" id="flip">
      <section class="face front">
        <figure class="avatar"><div class="ph">S</div><img src="images/profile.jpg" alt="Самара" onerror="this.remove()"></figure>
        <h1>SAMARA</h1>
        <p class="lead">IT үйрөнүп жатам</p>
        <p class="tech">HTML • CSS • JavaScript</p>
        <div class="contacts" id="contactBtns"></div>
      </section>
      <section class="face back">
        <h2>QR-КОД</h2>
        <div class="qr"><img src="images/qr.png" alt="QR-код" onerror="this.parentNode.innerHTML='<p>QR-кодду <b>images/qr.png</b> деп салыңыз</p>'"></div>
        <p class="muted">Сканерлеп, визиткамды ачыңыз</p>
      </section>
    </div>
  </div>

  <div class="actions">
    <button class="btn gold" id="saveBtn">＋ БАЙЛАНЫШКА САКТОО</button>
    <button class="btn" id="shareBtn">↗ БӨЛҮШҮҮ</button>
    <button class="btn" id="qrBtn">QR-КОД</button>
    <a class="btn" href="index-single.html">← ПОРТФОЛИОГО КАЙТУУ</a>
  </div>
  <p class="toast" id="toast" role="status"></p>
</main>
<script>
/* ===== МААЛЫМАТТАР — бардык тексттерди ушул жерден өзгөртсө болот ===== */
const CONTACT = { // шилтемелерди өзүңдүкүнө алмаштыр
  phone: 'tel:+996772646121', telegram: 'https://t.me/your_telegram',
  instagram: 'https://instagram.com/your_instagram', github: 'https://github.com/your-github', email: 'mailto:hello@samara.dev'
};
const ABOUT = [
  ['🎓', 'Билимим', `<h4>2006-жыл</h4><p>Крупская атындагы орус мектебин аяктадым.</p>
    <h4>ОшМУ — Финансы-экономикалык колледж</h4><p>Окууну аяктадым.</p>
    <h4>ОшМУ — Бизнес жана менеджмент факультети</h4><p>«Салык жана салык салуу» багыты боюнча билим алдым.</p>
    <h4>Атаназар кары медресеси</h4><p>Диний билим алып, медресени аяктадым.</p>`],
  ['💼', 'Иш тажрыйбам', `<h4>Азия Универсал Банк</h4><p>Практикадан өттүм.</p>
    <h4>РСК Банк</h4><p>Стажировкадан өттүм.</p>
    <h4>«Жаш Ниет» микрокредиттик агенттиги</h4><p>Иштедим.</p>
    <h4>Гулистан айыл өкмөтү</h4><p>Иштедим.</p>
    <h4>«Асылзада» диний уюму</h4><p class="now">● Азыркы учурда иштеп жатам.</p>
    <h4>«Шамс» жеке мектеби</h4><p class="now">● Азыркы учурда иштеп жатам.</p>
    <h4>Атаназар кары медресеси</h4><p class="now">● Азыркы учурда иштеп жатам.</p>`],
  ['🌐', 'Тилдер', `<h4>🇰🇬 Кыргыз тили</h4><p>Эркин сүйлөйм.</p><h4>🇷🇺 Орус тили</h4><p>Эркин сүйлөйм.</p>
    <h4>🇬🇧 Англис тили</h4><p>Билем.</p><h4>🇸🇦 Араб тили</h4><p>Учурда үйрөнүп жатам.</p>`],
  ['👨‍👩‍👦', 'Үй-бүлөм', `<p>Үй-бүлөлүүмүн, үч уулдун энесимин.</p>`],
  ['📚', 'Азыр үйрөнүп жатам', `<h4>IT</h4><p>HTML • CSS • JavaScript</p><h4>Араб тили</h4><p>Араб тилин учурда үйрөнүп жатам.</p>`]
];
// [аты, сүрөттөмө, "Көрүү" шилтемеси, GitHub шилтемеси] — '#' ордуна чыныгы URL коюңуз
const PROJECTS = [
  ['Nur Academy', 'Окуу борбору үчүн сайт.', '#', '#'],
  ['Араб тили', 'Сарф, нахв жана лугат боюнча окуу сайты.', '#', '#'],
  ['Крестик-нолик', 'JavaScript менен жасалган оюн.', '#', '#'],
  ['Samara Dubai', 'Абаялар үчүн заманбап сайт.', '#', '#'],
  ['Sapat Plast', 'Терезе жана эшик чыгарган компания үчүн сайт.', '#', '#']
];
const PATH = [['2006', 'Мектеп'], ['ОшМУ', 'Финансы-экономикалык билим'], ['ОшМУ', 'Салык жана салык салуу'],
  ['', 'Банк жана финансы тармагындагы тажрыйба'], ['', 'Микрокредиттик агенттик'], ['', 'Айыл өкмөтү'],
  ['', 'Диний жана билим берүү багыты'], ['2026', 'IT жана араб тили']];

const $ = s => document.querySelector(s);

/* ===== ПОРТФОЛИО БЕТИ ===== */
if ($('#about-cards')) {
  // Интерактивдүү карточкалар (smooth ачылат)
  $('#about-cards').innerHTML = ABOUT.map((a, i) => `<div class="item reveal" style="transition-delay:${i * .08}s">
    <button aria-expanded="false"><span style="font-size:1.6rem;color:inherit">${a[0]}</span>&nbsp;${a[1]}<span>＋</span></button>
    <div class="body"><div class="inner">${a[2]}</div></div></div>`).join('');
  document.querySelectorAll('.item button').forEach(b => b.onclick = () => {
    const item = b.parentNode, body = item.querySelector('.body'), open = item.classList.toggle('open');
    body.style.maxHeight = open ? body.scrollHeight + 'px' : 0;
    b.setAttribute('aria-expanded', open);
  });
  $('#project-list').innerHTML = PROJECTS.map((p, i) => `<article class="proj reveal" style="transition-delay:${i * .08}s">
    <div><b>0${i + 1}</b><h3>${p[0]}</h3><p class="muted">${p[1]}</p></div>
    <div class="row"><a class="btn" href="${p[2]}">Көрүү →</a><a class="btn" href="${p[3]}">GitHub →</a></div></article>`).join('');
  $('#path-list').innerHTML = PATH.map((p, i) => `<li class="reveal" style="transition-delay:${i * .07}s">${p[0] ? `<b>${p[0]}</b> — ` : ''}${p[1]}</li>`).join('');
  const io = new IntersectionObserver(es => es.forEach(e => e.isIntersecting && (e.target.classList.add('in'), io.unobserve(e.target))), {threshold: .15});
  document.querySelectorAll('.reveal').forEach(el => io.observe(el));
}

/* ===== ВИЗИТКА БЕТИ ===== */
if ($('#contactBtns')) {
  $('#contactBtns').innerHTML = [['📞 Телефон', CONTACT.phone], ['Telegram', CONTACT.telegram], ['Instagram', CONTACT.instagram], ['GitHub', CONTACT.github], ['Email', CONTACT.email]]
    .map(c => `<a href="${c[1]}" ${c[1].startsWith('http') ? 'target="_blank" rel="noopener"' : ''} onclick="event.stopPropagation()">${c[0]}</a>`).join('');
  const flip = $('#flip'), toast = t => { $('#toast').textContent = t; setTimeout(() => $('#toast').textContent = '', 2500); };
  const turn = () => flip.classList.toggle('turned');
  $('#scene').onclick = turn; $('#qrBtn').onclick = turn;
  $('#scene').onkeydown = e => (e.key === 'Enter' || e.key === ' ') && (e.preventDefault(), turn());
  // Байланышка сактоо: .vcf файл жүктөлөт, телефон өзү контакт катары ачат
  $('#saveBtn').onclick = () => {
    const v = `BEGIN:VCARD\nVERSION:3.0\nFN:Самара\nORG:SAMARA\nTITLE:IT үйрөнүп жатам\nTEL;TYPE=CELL:+996772646121\nEMAIL:${CONTACT.email.replace('mailto:', '')}\nURL:${CONTACT.github}\nEND:VCARD`;
    const a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob([v], {type: 'text/vcard'})); a.download = 'samara.vcf'; a.click();
    toast('Контакт файлы жүктөлдү');
  };
  // Бөлүшүү: телефондо меню ачылат, компьютерде шилтеме көчүрүлөт
  $('#shareBtn').onclick = async () => {
    const data = {title: 'SAMARA — визитка', url: location.href};
    try { if (navigator.share) { await navigator.share(data); } else { await navigator.clipboard.writeText(location.href); toast('Шилтеме көчүрүлдү'); } }
    catch (e) { toast('Шилтемени кол менен көчүрүңүз'); }
  };
}

</script>
</body>
</html>
